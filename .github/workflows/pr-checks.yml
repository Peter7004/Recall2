name: Recall PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: recall-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  flutter-checks:
    name: Recall PR Flutter checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - run: node --test test/web/startup_test.cjs
