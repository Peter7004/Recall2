name: recall
description: A visual front-and-back flashcard learning app.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  crypto: ^3.0.6
  csv: ^6.0.0
  file_picker: ^10.2.2
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  pdfrx: ^2.11.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocabulary/recall_core_v1.csv
    - web/branding/recall-logo.png
